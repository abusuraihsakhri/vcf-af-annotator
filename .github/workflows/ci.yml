name: VCF AF Annotator CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt httpx
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests and security regressions
        env:
          AUDIT_SECRET_KEY: ci-test-only-not-a-production-key
        run: python -m pytest -q
      - name: Check browser app syntax and tests
        run: |
          node --check web/annotator.mjs
          node --test web/annotator.test.mjs
      - name: Check secrets are not embedded in compose
        run: |
          ! grep -Eq 'AUDIT_SECRET_KEY=[^$]|API_TOKEN=[^$]' docker-compose.yml
